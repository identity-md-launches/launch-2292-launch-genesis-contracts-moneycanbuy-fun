[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "contracts/script"
out = "out"
cache_path = "cache"
libs = ["contracts/lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
remappings = [
    "forge-std/=contracts/lib/forge-std/src/",
    "@openzeppelin/contracts/=contracts/lib/openzeppelin-contracts/contracts/",
    "v4-core/=contracts/lib/v4-core/",
    "src/=contracts/src/",
]

[fuzz]
runs = 256

[invariant]
runs = 100
depth = 150
fail_on_revert = false

[fmt]
line_length = 120

[lint]
lint_on_build = false
